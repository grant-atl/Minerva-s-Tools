services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}

volumes:
  node_modules:
